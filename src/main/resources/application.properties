micronaut.application.name=library

# Database configuration - Can be overridden by environment variables
datasources.default.url=${JDBC_URL:jdbc:mysql://localhost:3306/library}
datasources.default.username=${JDBC_USER:root}
datasources.default.password=${JDBC_PASSWORD:password}
datasources.default.dialect=${JDBC_DIALECT:MYSQL}
datasources.default.driverClassName=${JDBC_DRIVER:com.mysql.cj.jdbc.Driver}
datasources.default.schema-generate=NONE

# Flyway configuration
flyway.datasources.default.enabled=true
flyway.datasources.default.locations=classpath:db/migration/${datasources.default.dialect}

# Test resources configuration - enabled by default but can be disabled
micronaut.test.resources.enabled=${TEST_RESOURCES_ENABLED:true}