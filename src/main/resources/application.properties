micronaut.application.name=library

datasources.default.dialect=MYSQL
datasources.default.db-type=mysql
datasources.default.driverClassName=com.mysql.cj.jdbc.Driver

datasources.default.url=jdbc:mysql://localhost:3306/${MYSQL_DATABASE:library_db}
datasources.default.username=${MYSQL_USER:library_dev_user}
datasources.default.password=${MYSQL_PASSWORD:password}
flyway.datasources.default.enabled=true